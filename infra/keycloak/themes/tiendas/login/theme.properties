# Tema de login de la plataforma (ADR-005). Extiende el tema "keycloak" y solo cambia el aspecto:
# el flujo sigue siendo OIDC estándar, y la contraseña la ve únicamente Keycloak.
parent=keycloak
import=common/keycloak

# css/login.css es la hoja del tema padre; css/tiendas.css la pisa con el diseño del sitio.
styles=css/login.css css/tiendas.css
