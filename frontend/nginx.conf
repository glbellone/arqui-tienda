server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # BLOQUE ESPECÍFICO: Solo para la analítica global, evitando que la barra final 
  # recorte el /api/ y manteniendo intacto el resto de la aplicación.
  location = /api/v1/admin/analitica/totales-por-tienda {
    proxy_pass http://gateway:8000/api/v1/admin/analitica/totales-por-tienda;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # La API general se sirve en el mismo origen. Se reenvía el Host original
  # con él, el gateway sabe de qué tienda es el pedido (ADR-011).
  location /api/ {
    proxy_pass http://gateway:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA: cualquier otra ruta que no sea un archivo la resuelve React.
  location / {
    try_files $uri /index.html;
  }
}