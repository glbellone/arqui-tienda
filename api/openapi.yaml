openapi: 3.0.3
info:
  title: Plataforma de Tiendas Online
  version: 1.0.0
  description: |
    API pública de la plataforma, expuesta a través del API Gateway.
    Nivel 2 del modelo de madurez de Richardson: recursos, verbos HTTP y códigos de estado.
    Los errores siguen el formato Problem Details (RFC 9457).

    Cada tienda se publica en su propio subdominio (ADR-011). Desde el subdominio de una tienda
    solo se llega a esa tienda: las rutas de la vitrina (tag Vitrina) no llevan el id, porque el
    gateway lo resuelve a partir del host y las traduce a /v1/tiendas/{tiendaId}/... (ADR-009).

    Mientras una tienda se muda de celda (pase a Premium, ADR-012), el gateway responde 503 con
    `Retry-After: 30` a cualquier pedido a esa tienda que no sea GET, HEAD u OPTIONS.
servers:
  - url: http://localhost:8000
    description: Gateway local (docker compose)
security: []
tags:
  - name: Administración
    description: |
      Rutas del dominio de la plataforma, solo para el rol admin. Las estadísticas las atiende el servicio
      de Analítica (ADR-006); las tiendas y las solicitudes, el servicio de Tiendas e Inquilinos (ADR-012).
  - name: Plan
    description: |
      Plan de la tienda y cambios de plan (pasar a Premium o volver a Estándar), para su dueño. Lo atiende el servicio de Tiendas e Inquilinos
      (ADR-012), no la celda. Desde el subdominio de la tienda, /v1/plan y /v1/plan/solicitud.
  - name: Tiendas
    description: Datos públicos de las tiendas de la plataforma.
  - name: Catálogo
    description: Productos de cada tienda.
  - name: Vitrina
    description: Rutas que se usan desde el subdominio de una tienda, por ejemplo la-yerbera.localhost.
  - name: Ventas
    description: Pedidos y cobro a través de la pasarela de pagos (ADR-007).
paths:
  /v1/admin/estadisticas:
    get:
      tags: [Administración]
      summary: Totales por tienda de toda la plataforma
      description: |
        Requiere el rol admin. Los totales se arman con los eventos que publican las celdas,
        así que tienen consistencia eventual. Desde el subdominio de una tienda esta ruta no existe.
      security:
        - oidc: []
      responses:
        '200':
          description: Totales por tienda
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EstadisticaTienda' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/admin/tiendas:
    get:
      tags: [Administración]
      operationId: listarTiendasAdmin
      summary: Todas las tiendas de la plataforma
      description: Requiere el rol admin. Incluye el plan, la celda donde vive cada tienda y si se está mudando.
      security:
        - oidc: []
      responses:
        '200':
          description: Las tiendas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TiendaAdmin' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
    post:
      tags: [Administración]
      operationId: crearTienda
      summary: Dar de alta una tienda
      description: |
        Requiere el rol admin. La tienda empieza en la celda pool con plan Estándar. Crea también el
        usuario del dueño en Keycloak y habilita el login desde su subdominio. Si un paso falla, se
        deshacen los anteriores (compensación). La contraseña del dueño se devuelve una sola vez.
      security:
        - oidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevaTienda' }
      responses:
        '201':
          description: Tienda creada
          headers:
            Location:
              description: URL de la tienda creada
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TiendaCreada' }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
  /v1/admin/tiendas/{tiendaId}:
    parameters:
      - $ref: '#/components/parameters/TiendaId'
    delete:
      tags: [Administración]
      operationId: darDeBajaTienda
      summary: Dar de baja una tienda
      description: |
        Requiere el rol admin. Saca la tienda del registro, borra sus datos de la celda (o la celda
        entera, si era una celda Premium creada para ella) y borra a su dueño de Keycloak.
        409 si la tienda se está mudando de celda.
      security:
        - oidc: []
      responses:
        '204': { description: Tienda dada de baja }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/admin/solicitudes:
    get:
      tags: [Administración]
      operationId: listarSolicitudesPremium
      summary: Solicitudes de cambio de plan
      description: Requiere el rol admin. De la más reciente a la más antigua, con el paso de la mudanza en curso.
      security:
        - oidc: []
      responses:
        '200':
          description: Las solicitudes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SolicitudAdmin' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/admin/solicitudes/{solicitudId}/aprobar:
    parameters:
      - $ref: '#/components/parameters/SolicitudId'
    post:
      tags: [Administración]
      operationId: aprobarSolicitudPremium
      summary: Aprobar un cambio de plan
      description: |
        Requiere el rol admin. Responde enseguida y la mudanza sigue en segundo plano. A Premium: se crea
        una celda nueva para la tienda, se frenan sus escrituras, se copian y verifican sus datos, se
        cambia el ruteo y se limpian sus datos de la pool. A Estándar: lo mismo hacia la pool, sin crear
        nada, y al final se libera la celda Premium (si se había creado para la tienda, se borra). El
        avance se sigue en GET /v1/admin/solicitudes (campo `paso`).
      security:
        - oidc: []
      responses:
        '202':
          description: Mudanza en curso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudAdmin' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/admin/solicitudes/{solicitudId}/rechazar:
    parameters:
      - $ref: '#/components/parameters/SolicitudId'
    post:
      tags: [Administración]
      operationId: rechazarSolicitudPremium
      summary: Rechazar un cambio de plan
      description: Requiere el rol admin. Solo se pueden rechazar las solicitudes pendientes.
      security:
        - oidc: []
      responses:
        '200':
          description: Solicitud rechazada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudAdmin' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/tiendas/{tiendaId}:
    parameters:
      - $ref: '#/components/parameters/TiendaId'
    get:
      tags: [Tiendas]
      operationId: obtenerTienda
      summary: Datos públicos de una tienda
      description: Público. Lo responde el gateway con su copia del registro, que le provee el servicio de Tiendas e Inquilinos (ADR-012).
      responses:
        '200':
          description: La tienda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tienda' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/tienda:
    servers:
      - url: http://{tienda}.localhost:8000
        variables:
          tienda: { default: la-yerbera, description: Subdominio de la tienda }
    get:
      tags: [Vitrina]
      operationId: obtenerTiendaActual
      summary: Datos públicos de la tienda del subdominio
      responses:
        '200':
          description: La tienda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tienda' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/productos:
    servers:
      - url: http://{tienda}.localhost:8000
        variables:
          tienda: { default: la-yerbera, description: Subdominio de la tienda }
    get:
      tags: [Vitrina]
      operationId: listarProductosTiendaActual
      summary: Productos de la tienda del subdominio
      description: Público. Equivale a /v1/tiendas/{tiendaId}/productos de la tienda dueña del subdominio.
      responses:
        '200':
          description: Productos de la tienda
          headers:
            X-Celda:
              description: Celda que atendió el pedido (pool o una celda Premium)
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Producto' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/pedidos:
    servers:
      - url: http://{tienda}.localhost:8000
        variables:
          tienda: { default: la-yerbera, description: Subdominio de la tienda }
    post:
      tags: [Vitrina]
      operationId: confirmarPedidoTiendaActual
      summary: Confirmar un pedido de la tienda del subdominio
      description: Público. Equivale a POST /v1/tiendas/{tiendaId}/pedidos de la tienda dueña del subdominio.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoPedido' }
      responses:
        '201':
          description: Pedido creado y cobrado. El estado puede ser PAGADO o RECHAZADO.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '200':
          description: Reintento con la misma Idempotency-Key. Devuelve el pedido existente sin cobrar de nuevo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
    get:
      tags: [Vitrina]
      operationId: listarPedidosTiendaActual
      summary: Pedidos de la tienda del subdominio (panel del dueño)
      description: Requiere rol duenio. Equivale a GET /v1/tiendas/{tiendaId}/pedidos de la tienda dueña del subdominio.
      security:
        - oidc: []
      responses:
        '200':
          description: Pedidos de la tienda, del más reciente al más antiguo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pedido' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/tiendas/{tiendaId}/productos:
    parameters:
      - $ref: '#/components/parameters/TiendaId'
    get:
      tags: [Catálogo]
      operationId: listarProductos
      summary: Listar los productos de una tienda
      description: Público. Solo devuelve productos de la tienda indicada.
      responses:
        '200':
          description: Productos de la tienda
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Producto' }
        '404': { $ref: '#/components/responses/Problema' }
    post:
      tags: [Catálogo]
      operationId: crearProducto
      summary: Cargar un producto en la tienda
      description: Requiere rol duenio y que el claim tienda_id del token coincida con la tienda de la URL.
      security:
        - oidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoProducto' }
      responses:
        '201':
          description: Producto creado
          headers:
            Location:
              description: URL del producto creado
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /v1/tiendas/{tiendaId}/productos/{productoId}:
    parameters:
      - $ref: '#/components/parameters/TiendaId'
      - name: productoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Catálogo]
      operationId: obtenerProducto
      summary: Obtener un producto de la tienda
      responses:
        '200':
          description: El producto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/tiendas/{tiendaId}/pedidos:
    parameters:
      - $ref: '#/components/parameters/TiendaId'
    post:
      tags: [Ventas]
      operationId: confirmarPedido
      summary: Confirmar un pedido y cobrarlo en la pasarela
      description: |
        Público. Crea el pedido con los precios de la tienda (el cliente no envía importes) y lo cobra
        a través de la pasarela de pagos (ADR-007). La Idempotency-Key identifica el intento de compra:
        repetir la misma clave con el mismo carrito devuelve el pedido ya existente y no genera un
        segundo cobro. Un pago rechazado no es un error HTTP: el pedido se crea con estado RECHAZADO.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NuevoPedido' }
      responses:
        '201':
          description: Pedido creado y cobrado. El estado puede ser PAGADO o RECHAZADO.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '200':
          description: Reintento con la misma Idempotency-Key. Devuelve el pedido existente sin cobrar de nuevo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pedido' }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
        '503': { $ref: '#/components/responses/Problema' }
    get:
      tags: [Ventas]
      operationId: listarPedidos
      summary: Listar los pedidos de una tienda
      description: Requiere rol duenio y que el claim tienda_id del token coincida con la tienda de la URL.
      security:
        - oidc: []
      responses:
        '200':
          description: Pedidos de la tienda, del más reciente al más antiguo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pedido' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/tiendas/{tiendaId}/plan:
    parameters:
      - $ref: '#/components/parameters/TiendaId'
    get:
      tags: [Plan]
      operationId: obtenerPlan
      summary: Plan de la tienda y la última solicitud de cambio de plan
      description: Requiere rol duenio y que el claim tienda_id del token coincida con la tienda de la URL.
      security:
        - oidc: []
      responses:
        '200':
          description: El plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanTienda' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/tiendas/{tiendaId}/plan/solicitud:
    parameters:
      - $ref: '#/components/parameters/TiendaId'
    post:
      tags: [Plan]
      operationId: pedirPremium
      summary: Pedir un cambio de plan
      description: |
        Requiere rol duenio y que el claim tienda_id del token coincida con la tienda de la URL. Sin
        cuerpo, se pide el otro plan (Premium si es Estándar, Estándar si es Premium). La solicitud
        queda pendiente hasta que la apruebe el administrador. 409 si la tienda ya tiene ese plan o si
        ya tiene una solicitud abierta.
      security:
        - oidc: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                plan: { type: string, enum: [Estándar, Premium], description: El plan al que quiere pasar }
      responses:
        '201':
          description: Solicitud creada
          headers:
            Location:
              description: URL del plan de la tienda
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudPremium' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: http://localhost:8080/realms/tiendas/.well-known/openid-configuration
  parameters:
    TiendaId:
      name: tiendaId
      in: path
      required: true
      description: Identificador de la tienda. El gateway lo usa para rutear a su celda.
      schema: { type: string, pattern: '^[a-z0-9-]{1,40}$', example: t1 }
    SolicitudId:
      name: solicitudId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Identifica el intento de compra (por ejemplo un UUID generado por el cliente). Reenviar la misma
        clave con el mismo carrito no cobra dos veces. Con la misma clave y otro carrito responde 422.
      schema: { type: string, maxLength: 200, example: 6f1c1d0e-8d2a-4f6b-9a53-2b7f0f9d4c11 }
  schemas:
    EstadisticaTienda:
      type: object
      properties:
        tiendaId: { type: string, example: t1 }
        productos: { type: integer, example: 6 }
        pedidosConfirmados: { type: integer, example: 5 }
        ventasCentavos: { type: integer, description: Total vendido en centavos, example: 14320000 }
        actualizadoEn: { type: string, format: date-time }
    Tienda:
      type: object
      properties:
        id: { type: string, example: t1 }
        nombre: { type: string, example: La Yerbera }
        rubro: { type: string, example: 'Yerbas, mates y bombillas' }
        plan: { type: string, enum: [Estándar, Premium] }
        color: { type: string, example: '#C98A12' }
        url: { type: string, description: Dirección pública de la tienda, example: 'http://la-yerbera.localhost:5173' }
    NuevoProducto:
      type: object
      required: [sku, nombre, precio]
      properties:
        sku: { type: string, maxLength: 64, example: REM-001 }
        nombre: { type: string, maxLength: 200, example: Remera de algodón }
        precio: { type: number, minimum: 0, example: 15000 }
        moneda: { type: string, pattern: '^[A-Z]{3}$', default: ARS }
    Producto:
      type: object
      properties:
        id: { type: string, format: uuid }
        tiendaId: { type: string, example: t1 }
        sku: { type: string, example: REM-001 }
        nombre: { type: string, example: Remera de algodón }
        precio:
          type: object
          properties:
            monto: { type: number, example: 15000 }
            moneda: { type: string, example: ARS }
    NuevoPedido:
      type: object
      required: [items, comprador, envio]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [productoId, cantidad]
            properties:
              productoId: { type: string, format: uuid }
              cantidad: { type: integer, minimum: 1, example: 2 }
        comprador: { $ref: '#/components/schemas/Comprador' }
        envio: { $ref: '#/components/schemas/Envio' }
    Comprador:
      type: object
      description: Datos de contacto de quien compra.
      required: [nombre, email]
      properties:
        nombre: { type: string, maxLength: 120, example: Ana Pérez }
        email: { type: string, format: email, example: ana@example.com }
        telefono: { type: string, maxLength: 40, example: '+54 11 5555-1234' }
    Envio:
      type: object
      description: Dónde se entrega el pedido.
      required: [direccion, ciudad, codigoPostal]
      properties:
        direccion: { type: string, maxLength: 200, example: Av. Vergara 2222 }
        ciudad: { type: string, maxLength: 100, example: Hurlingham }
        codigoPostal: { type: string, maxLength: 20, example: '1686' }
    Pedido:
      type: object
      properties:
        id: { type: string, format: uuid }
        tiendaId: { type: string, example: t1 }
        estado: { type: string, enum: [PENDIENTE, PAGADO, RECHAZADO] }
        totalCentavos: { type: integer, description: Total del pedido en centavos, example: 850000 }
        moneda: { type: string, example: ARS }
        pagoReferencia: { type: string, nullable: true, description: Identificador del cobro en la pasarela }
        comprador: { $ref: '#/components/schemas/Comprador' }
        envio: { $ref: '#/components/schemas/Envio' }
        creadoEn: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              productoId: { type: string, format: uuid }
              nombre: { type: string, example: Yerba mate 1kg }
              cantidad: { type: integer, example: 2 }
              precioCentavos: { type: integer, description: Precio unitario al momento de la compra, example: 425000 }
    TiendaAdmin:
      type: object
      description: Una tienda tal como la ve el administrador, con su celda.
      properties:
        id: { type: string, example: t100 }
        subdominio: { type: string, example: vivero-flores }
        nombre: { type: string, example: Vivero Flores }
        rubro: { type: string, example: Plantas y macetas }
        color: { type: string, example: '#4D7C0F' }
        plan: { type: string, enum: [Estándar, Premium] }
        celda: { type: string, description: Celda donde vive la tienda, example: pool }
        estado: { type: string, enum: [activa, mudandose], description: 'mudandose: se está pasando a otra celda' }
        creadaEn: { type: string, format: date-time }
        url: { type: string, example: 'http://vivero-flores.localhost:5173' }
    NuevaTienda:
      type: object
      required: [nombre, subdominio, rubro, duenio]
      properties:
        nombre: { type: string, maxLength: 80, example: Vivero Flores }
        subdominio: { type: string, pattern: '^[a-z0-9](-?[a-z0-9])*$', minLength: 3, maxLength: 40, example: vivero-flores }
        rubro: { type: string, maxLength: 80, example: Plantas y macetas }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$', description: Si no viene, se elige uno al azar }
        duenio:
          type: object
          required: [nombre, email]
          properties:
            nombre: { type: string, maxLength: 80, example: Flor Gómez }
            email: { type: string, format: email, example: flor@example.com }
    TiendaCreada:
      type: object
      properties:
        tienda: { $ref: '#/components/schemas/TiendaAdmin' }
        duenio:
          type: object
          description: Usuario del dueño en Keycloak. La contraseña se muestra una sola vez.
          properties:
            usuario: { type: string, example: flor@example.com }
            clave: { type: string }
    EstadoSolicitud:
      type: string
      enum: [pendiente, en-curso, completada, fallida, rechazada]
    SolicitudPremium:
      type: object
      description: La solicitud tal como la ve el dueño. Los detalles de la mudanza no se muestran.
      properties:
        id: { type: string, format: uuid }
        plan: { type: string, enum: [Estándar, Premium], description: El plan al que pidió pasar }
        estado: { $ref: '#/components/schemas/EstadoSolicitud' }
        creadaEn: { type: string, format: date-time }
        actualizadaEn: { type: string, format: date-time }
    PlanTienda:
      type: object
      properties:
        plan: { type: string, enum: [Estándar, Premium] }
        solicitud:
          allOf: [{ $ref: '#/components/schemas/SolicitudPremium' }]
          nullable: true
          description: La última solicitud de cambio de plan, o null si nunca pidió
    SolicitudAdmin:
      type: object
      description: La solicitud tal como la ve el administrador, con el avance de la mudanza.
      properties:
        id: { type: string, format: uuid }
        tiendaId: { type: string, example: t100 }
        plan: { type: string, enum: [Estándar, Premium], description: El plan al que pidió pasar }
        estado: { $ref: '#/components/schemas/EstadoSolicitud' }
        paso:
          type: string
          nullable: true
          enum: [creando-celda, frenando-escrituras, copiando-datos, verificando, cambiando-ruteo, limpiando-pool, liberando-celda]
          description: Paso de la mudanza en curso
        celdaOrigen: { type: string, nullable: true, example: pool }
        celdaDestino: { type: string, nullable: true, example: premium-t100 }
        error: { type: string, nullable: true, description: Por qué falló la mudanza }
        creadaEn: { type: string, format: date-time }
        actualizadaEn: { type: string, format: date-time }
        tienda:
          type: object
          description: Datos de la tienda. No viene si la tienda se dio de baja.
          properties:
            nombre: { type: string }
            subdominio: { type: string }
            plan: { type: string, enum: [Estándar, Premium] }
            celda: { type: string }
            color: { type: string }
    Problema:
      type: object
      description: Problem Details (RFC 9457)
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Prohibido }
        status: { type: integer, example: 403 }
        detail: { type: string, example: Solo podés cargar productos en tu propia tienda }
        instance: { type: string, example: /v1/tiendas/t2/productos }
  responses:
    Problema:
      description: Error en formato Problem Details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
